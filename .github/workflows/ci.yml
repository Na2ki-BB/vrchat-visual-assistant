name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.422

      - name: Restore
        run: dotnet restore VRChatVisualAssistant.sln

      - name: Build
        run: dotnet build VRChatVisualAssistant.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test VRChatVisualAssistant.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 7
