name: Feature request
description: Propose an in-scope trigger, capture, analyzer, provider, or renderer change.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the VR interaction problem before proposing an implementation.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Trigger
        - Capture
        - Analyzer/OCR
        - Translation provider
        - Renderer/VR overlay
        - Privacy/security
        - Other
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and external data impact
      description: State whether pixels, OCR text, or other data would leave the device.
    validations:
      required: true

